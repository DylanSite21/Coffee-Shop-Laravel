services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coffee_shop_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    environment:
      APP_NAME: "${APP_NAME:-Coffee Shop}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-coffedylan}"
      DB_USERNAME: "${DB_USERNAME:-root}"
      DB_PASSWORD: "${DB_PASSWORD:-secret123}"
      AUTORUN_MIGRATIONS: "true"
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - coffee_network

  db:
    image: mysql:8.0
    container_name: coffee_shop_db
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-coffedylan}"
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-secret123}"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-secret123}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coffee_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: coffee_shop_pma
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8080}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db
    networks:
      - coffee_network

volumes:
  db_data:
    driver: local
  app_storage:
    driver: local

networks:
  coffee_network:
    driver: bridge
